      - name: Retain bounded inventory evidence even on refusal
        if: ${{ always() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fotf-host-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            host-inventory-evidence/inventory.json
            host-inventory-evidence/manifest.json
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
