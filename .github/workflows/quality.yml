name: Quality

on:
  pull_request:
    branches: [develop, production]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Verify production releases come from develop
        if: github.base_ref == 'production' && github.head_ref != 'develop'
        run: |
          echo "Production releases must come from the develop branch."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check generated binding types
        run: |
          npx wrangler types --config dist/server/wrangler.json
          npx tsc --noEmit

      - name: Verify candidate identity guards
        run: node --test ops/cloud-audit/tests/*.test.mjs
